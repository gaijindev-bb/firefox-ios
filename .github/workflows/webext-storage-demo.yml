# Runs a single browser-chrome mochitest (webext storage-principal forge demo,
# bug 2071876) on ubuntu against the PINNED Firefox Nightly build (same binary
# as the w1 evidence run) plus its matching tests archives. Verifies the
# binary's source stamp against the pinned mozilla-central revision and the
# load-bearing validator code in the pinned source before results count as proof.
name: webext-storage-demo
on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Write harness files
        run: |
          mkdir -p w2-files
          echo '' | base64 -d > w2-files/run_w2.sh
          echo '' | base64 -d > w2-files/browser_ext_storage_forge.js
          echo '' | base64 -d > w2-files/storage_poc_child.sys.mjs
          echo 'PCFkb2N0eXBlIGh0bWw+Cjx0aXRsZT5kZW1vIHBhZ2U8L3RpdGxlPgo8aDE+cGxhaW4gd2ViIHBhZ2UgKHJlbW90ZVR5cGUgd2ViKTwvaDE+CjxwPkFjdHMgYXMgdGhlIHNpbXVsYXRlZCBjb21wcm9taXNlZCByZW5kZXJlcidzIG9yaWdpbi4gTm8gZXh0ZW5zaW9uIEFQSXMuPC9wPgo=' | base64 -d > w2-files/attacker.html
          chmod +x w2-files/run_w2.sh
      - name: Run storage forge demo
        run: |
          w2-files/run_w2.sh "$GITHUB_WORKSPACE/w2-work" "$GITHUB_WORKSPACE/evidence-w2"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-evidence
          path: evidence-w2/
