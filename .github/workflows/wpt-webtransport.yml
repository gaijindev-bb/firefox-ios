# Runs a single upstream web-platform-test (webtransport certificate hashes)
# plus a local-only variant against a Web-PKI-trusted endpoint, on ubuntu with
# the latest Firefox Nightly. The variant file is CI-local and never upstreamed.
name: wpt-webtransport
on:
  workflow_dispatch:

jobs:
  wpt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WPT_TEST_HOST: ${{ secrets.WPT_TEST_HOST }}
      WPT_CERT_PEM: ${{ secrets.WPT_CERT_PEM }}
      WPT_KEY_PEM: ${{ secrets.WPT_KEY_PEM }}
    steps:
      - name: Write harness files
        run: |
          mkdir -p wpt-files
          echo '' | base64 -d > wpt-files/run_wpt.sh
          echo '' | base64 -d > wpt-files/server_h3.py
          echo '' | base64 -d > wpt-files/variant-cert-hashes.https.any.js
          chmod +x wpt-files/run_wpt.sh
      - name: Run WPT lane
        run: |
          wpt-files/run_wpt.sh "$GITHUB_WORKSPACE/wpt-work" "$GITHUB_WORKSPACE/evidence-wpt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-evidence
          path: evidence-wpt/
