# Builds the Fennec (developer) configuration of mozilla-mobile/firefox-ios for
# the iOS Simulator, then runs three scripted simulator checks and uploads the
# evidence (logs + screenshots) as a workflow artifact. Manual trigger only.
name: fennec-simulator-demos
on:
  workflow_dispatch:

jobs:
  build-and-demos:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      FI_DIR: ${{ github.workspace }}/firefox-ios-src
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      - name: Materialize demo harness
        run: |
          set -euxo pipefail
          mkdir -p fixtures scripts
          echo '' | base64 -d > fixtures/fixture_row1.py
          echo '' | base64 -d > fixtures/fixture_row2.py
          echo '' | base64 -d > scripts/run_demos.sh
          echo '' | base64 -d > scripts/row3_deeplink.sh

          echo '' | base64 -d > scripts/backport_swiftpm.py
          echo '' | base64 -d > scripts/pick_sim.py
          chmod +x scripts/*.sh

      - name: Select Xcode 16.x (16.4/16.3 preferred - SwiftPM trailing-comma fix; upstream pins 16.2 but main needs >= 6.1)
        run: |
          set -euxo pipefail
          ls -d /Applications/Xcode*.app
          sudo rm -rf /Applications/Xcode.app || true
          XCODE=$(ls -d /Applications/Xcode_16.4*.app /Applications/Xcode_16.3*.app /Applications/Xcode_16.2*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Clone firefox-ios (shallow)
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/mozilla-mobile/firefox-ios.git "$FI_DIR"
          git -C "$FI_DIR" rev-parse HEAD | tee firefox-ios-commit.txt

      - name: Backport SwiftPM manifest syntax (Swift < 6.1 trailing commas)
        run: |
          set -euxo pipefail
          python3 scripts/backport_swiftpm.py "$FI_DIR"

      - name: Bootstrap (fxios)
        run: |
          set -euxo pipefail
          brew tap mozilla-mobile/fxios
          brew trust mozilla-mobile/fxios
          brew install fxios
          cd "$FI_DIR"
          fxios bootstrap
          ./bootstrap.sh focus || true
          ./bootstrap.sh firefox --force

      - name: Build Fennec (iOS Simulator)
        timeout-minutes: 180
        run: |
          set -euxo pipefail
          cd "$FI_DIR/firefox-ios"
          # First resolve fetches remote checkouts; their manifests may also
          # declare newer swift-tools-version, so patch them and resolve again.
          xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project Client.xcodeproj -scheme Fennec -derivedDataPath "$FI_DIR/DerivedData" || true
          python3 "$GITHUB_WORKSPACE/scripts/backport_swiftpm.py" "$FI_DIR/DerivedData" || true
          if ! xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project Client.xcodeproj -scheme Fennec -derivedDataPath "$FI_DIR/DerivedData"; then
            echo "[diag] post-backport resolve failed; retrying once after 20s"
            sleep 20
            xcodebuild -resolvePackageDependencies -onlyUsePackageVersionsFromResolvedFile -project Client.xcodeproj -scheme Fennec -derivedDataPath "$FI_DIR/DerivedData"
          fi
          # Runner images no longer ship the pinned iOS 18.2 simulator runtime,
          # so create a build destination on the newest runtime compatible with
          # the selected Xcode's simulator SDK (see pick_sim.py).
          if ! BUILD_UDID=$(python3 "$GITHUB_WORKSPACE/scripts/pick_sim.py" CIBuildSim); then
            echo "[diag] pick_sim failed; dumping simulator state for diagnosis"
            xcodebuild -version || true
            xcrun --sdk iphonesimulator --show-sdk-version || true
            xcrun simctl list runtimes || true
            exit 1
          fi
          echo "build simulator: $BUILD_UDID"
          xcodebuild build-for-testing -scheme Fennec -target Client \
            -derivedDataPath "$FI_DIR/DerivedData" \
            -destination "platform=iOS Simulator,id=$BUILD_UDID" \
            -skipMacroValidation -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ARCHS="arm64" \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild_fennec.log"
          ls "$FI_DIR"/DerivedData/Build/Products/

      - name: Record source snippets
        run: |
          set -euxo pipefail
          mkdir -p "$EVIDENCE"
          SRC="$FI_DIR/firefox-ios"
          cp "$SRC/nimbus-features/customReaderModeSchemeFeature.yaml" "$EVIDENCE/" || true
          sed -n '40,62p' "$SRC/Client/Frontend/Browser/DownloadHelper/DownloadHelper.swift" \
            > "$EVIDENCE/DownloadHelper-snippet.swift.txt" || true

      - name: Run simulator demo rows
        timeout-minutes: 45
        run: |
          set -ux
          chmod +x scripts/*.sh || true
          bash scripts/run_demos.sh "$FI_DIR" "$EVIDENCE"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence
          path: |
            evidence/
            xcodebuild_fennec.log
            firefox-ios-commit.txt
          if-no-files-found: warn
