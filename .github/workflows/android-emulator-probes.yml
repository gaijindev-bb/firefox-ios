# Android emulator probe lane: downloads official Fenix/Focus Nightly APKs,
# boots a hardware-accelerated emulator on the macos runner, builds the small
# probe-companion APK, runs scripted UI probes against local fixture pages,
# and uploads screenshots/logs as evidence.
name: android-emulator-probes
on:
  workflow_dispatch:

jobs:
  emulator-probes:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      EVIDENCE: ${{ github.workspace }}/evidence-android
    steps:

      - name: Materialize harness
        run: |
          set -euxo pipefail
          mkdir -p android
          mkdir -p android/attacker
          mkdir -p android/attacker/res/anim
          mkdir -p android/attacker/res/values
          mkdir -p android/attacker/src/ci/probes/attacker
          echo '' | base64 -d > android/fixture_android.py
          echo '' | base64 -d > android/probes_android.py
          echo '' | base64 -d > android/build_attacker.sh
          echo '' | base64 -d > android/run_android_probes.sh
          echo '' | base64 -d > android/attacker/AndroidManifest.xml
          echo '' | base64 -d > android/attacker/res/anim/slow_enter.xml
          echo 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5wcm9iZS1jb21wYW5pb248L3N0cmluZz48L3Jlc291cmNlcz4K' | base64 -d > android/attacker/res/values/strings.xml
          echo '' | base64 -d > android/attacker/src/ci/probes/attacker/MainActivity.java
          echo '' | base64 -d > android/attacker/src/ci/probes/attacker/ClipboardActivity.java
          echo '' | base64 -d > android/attacker/src/ci/probes/attacker/OverlayActivity.java
          chmod +x android/*.sh
      - name: Run emulator probes
        timeout-minutes: 100
        run: |
          set -ux
          bash android/run_android_probes.sh "$GITHUB_WORKSPACE" "$EVIDENCE"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-probe-evidence
          path: evidence-android/
          if-no-files-found: warn
