# Runs a single browser-chrome mochitest (webext messaging demo) on ubuntu
# against the latest Firefox Nightly plus its matching common.tests archive.
# Verifies five gate-listed source files in the binary against a pinned
# mozilla-central revision before results count as proof.
name: webext-messaging-demo
on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Write harness files
        run: |
          mkdir -p w1-files
          echo '' | base64 -d > w1-files/run_w1.sh
          echo '' | base64 -d > w1-files/browser_ext_messaging_demo.js
          echo 'PCFkb2N0eXBlIGh0bWw+Cjx0aXRsZT5kZW1vIHBhZ2U8L3RpdGxlPgo8aDE+cGxhaW4gd2ViIHBhZ2UgKHJlbW90ZVR5cGUgd2ViKTwvaDE+CjxwPkFjdHMgYXMgdGhlIHNpbXVsYXRlZCBjb21wcm9taXNlZCByZW5kZXJlcidzIG9yaWdpbi4gTm8gZXh0ZW5zaW9uIEFQSXMuPC9wPgo=' | base64 -d > w1-files/attacker.html
          chmod +x w1-files/run_w1.sh
      - name: Run messaging demo
        run: |
          w1-files/run_w1.sh "$GITHUB_WORKSPACE/w1-work" "$GITHUB_WORKSPACE/evidence-w1"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-evidence
          path: evidence-w1/
