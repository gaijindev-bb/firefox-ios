# Daily watch over newly landed security-shaped fixes in m-c (github mirror),
# firefox-ios and focus-android. Flags one-path fixes: an anti-pattern removed
# in one file while siblings keep it. Output: report.md artifact.
name: fix-watcher
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - name: Materialize harness
        run: |
          set -euxo pipefail
          mkdir -p fixwatch
          echo '' | base64 -d > fixwatch/fix_watch.py
      - name: Run watcher
        run: python3 fixwatch/fix_watch.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-watcher-report
          path: fixwatch-out/
          if-no-files-found: warn
