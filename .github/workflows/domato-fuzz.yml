# Timeboxed Domato DOM-fuzz loop against the latest Firefox Nightly on a
# macos-15 runner. Generates samples with the public Domato generator, drives
# Nightly headless at each case (20s timeout), and uploads crash candidates.
name: domato-fuzz
on:
  workflow_dispatch:

jobs:
  domato-fuzz:
    runs-on: macos-15
    timeout-minutes: 330
    env:
      WORK: ${{ github.workspace }}/fuzzwork
    steps:
      - name: Clone Domato
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/googleprojectzero/domato.git "$GITHUB_WORKSPACE/domato"
          git -C "$GITHUB_WORKSPACE/domato" rev-parse HEAD | tee domato-commit.txt

      - name: Materialize harness
        run: |
          set -euxo pipefail
          mkdir -p fuzz
          echo '' | base64 -d > fuzz/runner.py
      - name: Download latest Firefox Nightly
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          curl -L 'https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=osx&lang=en-US' -o /tmp/nightly.dmg
          hdiutil attach /tmp/nightly.dmg -nobrowse -readonly
          ls /Volumes/
          cp -R "/Volumes/Firefox Nightly/Firefox Nightly.app" "$GITHUB_WORKSPACE/Firefox Nightly.app"
          hdiutil detach "/Volumes/Firefox Nightly" || true
          "$GITHUB_WORKSPACE/Firefox Nightly.app/Contents/MacOS/firefox" --version
      - name: Run fuzz loop
        timeout-minutes: 290
        run: |
          set -ux
          mkdir -p "$WORK/profile"
          python3 fuzz/runner.py "$GITHUB_WORKSPACE/Firefox Nightly.app/Contents/MacOS/firefox" "$WORK/profile" "$WORK" "$GITHUB_WORKSPACE/domato/generator.py" 270 2>&1 | tee evidence-fuzz.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domato-fuzz-evidence
          path: |
            fuzzwork/crashes/
            evidence-fuzz.log
            domato-commit.txt
          if-no-files-found: warn
