# Downloads the latest Firefox Nightly on a macos-15 runner (no build) and runs
# scripted desktop UI surface + navigation-desync probes against local fixture
# origins, uploading logs and screenshots as evidence.
name: desktop-nightly-probes
on:
  workflow_dispatch:

jobs:
  nightly-probes:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:

      - name: Materialize harness
        run: |
          set -euxo pipefail
          mkdir -p desktop
          echo '' | base64 -d > desktop/fixture_server.py
          echo '' | base64 -d > desktop/desktop_probes.py
          echo '' | base64 -d > desktop/uihelper.swift
          echo '' | base64 -d > desktop/run_desktop_probes.sh
          chmod +x desktop/*.sh
      - name: Download latest Firefox Nightly
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          curl -L 'https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=osx&lang=en-US' -o /tmp/nightly.dmg
          hdiutil attach /tmp/nightly.dmg -nobrowse -readonly
          ls /Volumes/
          cp -R "/Volumes/Firefox Nightly/Firefox Nightly.app" "$GITHUB_WORKSPACE/Firefox Nightly.app"
          hdiutil detach "/Volumes/Firefox Nightly" || true
          "$GITHUB_WORKSPACE/Firefox Nightly.app/Contents/MacOS/firefox" --version
      - name: Run desktop probes
        timeout-minutes: 60
        run: |
          set -ux
          bash desktop/run_desktop_probes.sh "$GITHUB_WORKSPACE" "$EVIDENCE"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-probe-evidence
          path: evidence/
          if-no-files-found: warn
