# Static candidate-pattern scan over the firefox-ios checkout using semgrep.
# Findings are review candidates only - each needs source inspection.
name: static-pattern-scan
on:
  workflow_dispatch:

jobs:
  semgrep:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialize harness
        run: |
          set -euxo pipefail
          mkdir -p static
          echo '' | base64 -d > static/semgrep-rules.yml
          echo '' | base64 -d > static/summarize.py
      - name: Install semgrep
        run: python3 -m pip install --quiet semgrep

      - name: Scan
        run: |
          set -ux
          mkdir -p scan-out
          semgrep scan --config static/semgrep-rules.yml --json -o scan-out/semgrep.json . || true
          python3 static/summarize.py

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-scan-findings
          path: scan-out/
          if-no-files-found: warn
